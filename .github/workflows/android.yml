name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee build.log) 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --assetPath resources \
            --iconBackgroundColor '#F4F1EB' --splashBackgroundColor '#F4F1EB' || echo "icon generation skipped"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Logistic-Invoice-Maker.apk

      - name: Show error in run summary
        if: failure()
        shell: bash
        run: |
          { echo '### Build failed — last log lines'; echo '```'; tail -n 80 build.log 2>/dev/null || echo 'no log'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Logistic-Invoice-Maker-apk
          path: Logistic-Invoice-Maker.apk

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Logistic Invoice Maker — latest build
          body: |
            Download **Logistic-Invoice-Maker.apk** below and open it on your Android phone to install.
            (Allow "Install unknown apps" for your browser / file manager when asked.)
            Built from commit ${{ github.sha }}.
          make_latest: true
          files: Logistic-Invoice-Maker.apk
