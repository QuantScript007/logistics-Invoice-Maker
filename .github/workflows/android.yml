name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor '#F4F1EB' --splashBackgroundColor '#F4F1EB'

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MOFA-Quotes.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MOFA-Quotes-apk
          path: MOFA-Quotes.apk

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MOFA Quotes — latest build
          body: |
            Download **MOFA-Quotes.apk** below and open it on your Android phone to install.
            (Allow "Install unknown apps" for your browser / file manager when asked.)
            Built from commit ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: MOFA-Quotes.apk
